name: Refresco y análisis

# Cada 10 min: refresca resultados en vivo, analiza los partidos del día, LIQUIDA y envía push.
# (Además: análisis bajo demanda con el botón 'Ver análisis' en cada partido + liquidación instantánea
# al abrir la app, ver api/views.)
# GitHub Actions free a veces se salta los crons más frecuentes; 10 min es el más fiable.
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: daily-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Refresco + análisis + liquidación
        run: python -m src.scheduler.daily_refresh
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_TOKEN: ${{ secrets.FOOTBALL_DATA_TOKEN }}
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
          VAPID_PUBLIC_KEY: ${{ secrets.VAPID_PUBLIC_KEY }}
          VAPID_PRIVATE_KEY: ${{ secrets.VAPID_PRIVATE_KEY }}
          VAPID_SUBJECT: ${{ secrets.VAPID_SUBJECT }}
