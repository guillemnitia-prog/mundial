# Blueprint de Render: backend FastAPI (plan FREE) + base de datos en Supabase (Postgres gratis).
# El frontend va en Vercel (ver DEPLOY.md). Sin disco ni cron (no disponibles en free):
# el análisis diario se dispara a mano o con un cron externo que llame al backend.
services:
  - type: web
    name: mundial-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    plan: free
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL          # cadena de conexión de Supabase (Postgres)
        sync: false
      - key: COOKIE_SECURE
        value: "true"
      - key: COOKIE_SAMESITE
        value: none
      - key: FRONTEND_ORIGIN       # https://<tu-app>.vercel.app
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: FOOTBALL_DATA_TOKEN
        sync: false
      - key: ODDS_API_KEY
        sync: false
      - key: VAPID_PUBLIC_KEY
        sync: false
      - key: VAPID_PRIVATE_KEY
        sync: false
      - key: VAPID_SUBJECT
        sync: false
